<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acaraje da Josi | Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fffaf0;
        color: #2f3a3a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.08), transparent 24%),
          radial-gradient(circle at bottom right, rgba(251, 191, 36, 0.12), transparent 28%),
          #fffaf0;
      }

      main {
        width: min(90vw, 34rem);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.85);
        padding: 2rem;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Voce esta offline</h1>
      <p>
        O app continua instalado, mas o conteudo mais recente precisa de conexao para carregar.
        Assim que a internet voltar, reabra o cardapio para continuar o pedido.
      </p>
    </main>
  </body>
</html>
